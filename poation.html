<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my pet page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: blue;
            padding: 65px 30px 30px 30px;
            min-height: 1800px;
        }
        h1,h2 { color:brown}

        .top-bar {
            position: fixed;
            top: 0; 
            left: 0;
            right: 0;
            background-color: rgb(0, 46, 182);
            color: aliceblue;
            padding:14px 20px;
        }

        .list-item {
            background-color: black;
            border: 2px solid;
            padding: 10px 20px;
            margin: 5px 0;
        }

        .special-note{
            position: relative;
            left: 30px;
            background-color: aqua;
            padding: 10px 20px;
        }

        .pet-card{
            position: relative;
            background-color: aliceblue;
            border: 3px;
            padding: 15px 25px;
        }

        .badge{
            position: absolute;
            top: 8px;
            background-color: aqua;
            color: aliceblue;
            padding: 4px 8px;
        }

        .section-lable{
            position: sticky;
            top: 55px;
            background-color: black;
            color: aliceblue;
            padding: 10px 20px;
            margin: 15px 0 18px;
        }

    </style>
</head>
<body>
<div class="top-bar">my prt page - buddy the labrador</div>
<h1>meet buddy!</h1>

<h2>static</h2>
<div class="list-item">breed: labradorr</div>
<div class="list-item">age: 2 years</div>

</body>
</html>
