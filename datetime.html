<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: aliceblue;
            padding:30px;
        }
        h1 { color : navy}
        button {
            background-color: navy;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;

        }
        div {
            border: 1px solid navy;
            width: 280px;
            margin: 6px auto;
            padding: 8px 12px;
            text-align: left;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    

    <h1>my game profile</h1>
    <button onclick="showprofile()">show profile</button>


    <div>name: <span id="name"></span></div>
    <div>score: <span id="score"></span></div>
    <div>top score: <span id="record"></span></div>
    <div>rank: <span id="rank"></span></div>
    <div>greeting: <span id="greeting"></span></div>
    <div>stars: <span id="stars"></span></div>
    <div>bonus level: <span id="bonus"></span></div>
    <div>team name: <span id="team">team</span></div>
</body>
</html>
